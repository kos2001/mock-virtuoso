name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (no bridge installed)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # The contract tests importorskip virtuoso_bridge, so this job proves the
      # package stands alone — no bridge, no Cadence, no network.
      - run: pytest -q
      - name: mock_virtuoso must never import virtuoso_bridge
        run: |
          if grep -rnE '^\s*(import|from)\s+virtuoso_bridge' src/; then
            echo "::error::src/ imports the bridge; only tests/contract/ may"
            exit 1
          fi
      # A unit test that imports the bridge fails here, where it is absent, and
      # is never collected by the contract job, which runs tests/contract only.
      - name: unit tests must not import virtuoso_bridge either
        run: |
          if grep -rnE '^\s*(import|from)\s+virtuoso_bridge' tests/ --include='*.py' --exclude-dir=contract --exclude-dir=tools; then
            echo "::error::a unit test imports the bridge; move it to tests/contract/"
            exit 1
          fi

  package:
    name: package (the wheel stands alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      # The bundled tools drive the mock through virtuoso-bridge; the package
      # itself must not depend on it, and must not ship them either.
      - name: the wheel ships the package and nothing else
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          extra = tops - {"mock_virtuoso", "mock_virtuoso-0.1.0.dist-info"}
          if extra:
              raise SystemExit(f"::error::wheel also ships {sorted(extra)}")
          print("wheel top level:", sorted(tops))
          EOF
      # Installed from the wheel, outside the checkout, with no bridge and no
      # dev extras: importing and serving must still work.
      - name: the installed wheel serves on its own
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python - <<'EOF'
          import json, socket
          from mock_virtuoso.auth import Authenticator
          from mock_virtuoso.server import MockVirtuosoServer
          from mock_virtuoso.session import Session

          server = MockVirtuosoServer(Session(), authenticator=Authenticator(None))
          server.start()
          with socket.create_connection(("127.0.0.1", server.port)) as s:
              s.sendall(json.dumps({"skill": "1+2", "timeout": 30}).encode())
              s.shutdown(socket.SHUT_WR)
              reply = s.recv(100)
          server.stop()
          assert reply == b"\x023", reply
          print("wheel-installed daemon answered", reply)
          EOF
          /tmp/clean/bin/mock-virtuoso --help > /dev/null

  contract:
    name: contract (against virtuoso-bridge-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: mock-virtuoso }
      - uses: actions/checkout@v7
        with:
          repository: Arcadia-1/virtuoso-bridge-lite
          path: virtuoso-bridge-lite
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - working-directory: mock-virtuoso
        run: |
          pip install -e ".[dev]"
          pip install -e ../virtuoso-bridge-lite
      # These drive the real bridge's builders, client API and readers against
      # the mock. A bridge change that breaks them is a real regression.
      - working-directory: mock-virtuoso
        run: pytest tests/contract -q
      - name: contract tests must actually run, not skip
        working-directory: mock-virtuoso
        run: |
          pytest tests/contract -q 2>&1 | tee out.txt
          grep -qE '[0-9]+ passed' out.txt || { echo "::error::no contract tests ran"; exit 1; }
          grep -qE 'skipped' out.txt && { echo "::error::contract tests were skipped"; exit 1; }
          exit 0
