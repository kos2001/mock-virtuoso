<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="mock-virtuoso">
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <!-- three mask layers, solid so they survive 16px -->
  <rect x="12" y="13" width="40" height="11" rx="2.5" fill="#4493f8"/>
  <rect x="19" y="27" width="26" height="10" rx="2.5" fill="#f85149"/>
  <rect x="12" y="40" width="40" height="11" rx="2.5" fill="#3fb950"/>
  <!-- vias stitching the stack -->
  <rect x="28" y="21" width="8" height="9" rx="1.5" fill="#e3b341" stroke="#0d1117" stroke-width="2"/>
  <rect x="28" y="34" width="8" height="9" rx="1.5" fill="#e3b341" stroke="#0d1117" stroke-width="2"/>
</svg>
