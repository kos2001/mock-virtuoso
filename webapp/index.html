<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Layout Workbench</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --fg:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --err:#f85149;
    --canvas:#07090d; --grid:#161d27; --axis:#233043;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .menubar{display:flex;align-items:center;gap:2px;background:var(--panel);
    border-bottom:1px solid var(--line);padding:4px 8px;flex:0 0 auto}
  .menubar .brand{font-weight:700;color:var(--fg);margin-right:14px;letter-spacing:.3px}
  .menubar .brand span{color:var(--accent)}
  .menubar button.menu{background:none;border:0;color:var(--dim);padding:3px 8px;
    border-radius:4px;font:inherit;cursor:default}
  .menubar button.menu:hover{background:var(--panel2);color:var(--fg)}
  .menubar .spacer{flex:1}
  .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px}
  .badge b{color:var(--ok);font-weight:600}

  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel2);
    border-bottom:1px solid var(--line);padding:6px 8px;flex:0 0 auto}
  .toolbar button{background:#21262d;border:1px solid var(--line);color:var(--fg);
    padding:5px 11px;border-radius:5px;font:inherit;cursor:pointer}
  .toolbar button:hover{border-color:var(--accent);color:#fff}
  .toolbar button:active{transform:translateY(1px)}
  .toolbar button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .toolbar select{background:#21262d;border:1px solid var(--line);color:var(--fg);
    padding:4px 8px;border-radius:5px;font:inherit}
  .toolbar label{color:var(--dim)}

  .main{flex:1;display:flex;min-height:0}
  .canvas-wrap{flex:1;position:relative;background:var(--canvas);min-width:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .hud{position:absolute;left:10px;top:10px;pointer-events:none;color:var(--dim);
    font-size:11px;background:rgba(7,9,13,.72);border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;line-height:1.7}
  .hud b{color:var(--fg);font-weight:600}

  .lsw{width:216px;flex:0 0 216px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .lsw h3,.ciw h3{margin:0;padding:7px 10px;font-size:11px;letter-spacing:.9px;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
    background:var(--panel2)}
  .layers{overflow:auto;padding:4px}
  .layer{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer}
  .layer:hover{background:var(--panel2)}
  .layer.off{opacity:.35}
  .layer .sw{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.28);flex:0 0 auto}
  .layer .nm{flex:1}
  .layer .ct{color:var(--dim);font-size:11px}

  .ciw{height:212px;flex:0 0 212px;background:var(--panel);border-top:1px solid var(--line);
    display:flex;flex-direction:column}
  .console{flex:1;overflow:auto;padding:6px 10px;white-space:pre-wrap;word-break:break-word}
  .console .cmd{color:var(--accent)}
  .console .cmd::before{content:"> ";color:var(--dim)}
  .console .ok{color:var(--fg)}
  .console .err{color:var(--err)}
  .console .sys{color:var(--dim);font-style:italic}
  .prompt{display:flex;gap:8px;border-top:1px solid var(--line);padding:7px 10px;align-items:center}
  .prompt span{color:var(--ok)}
  .prompt input{flex:1;background:#0d1117;border:1px solid var(--line);border-radius:5px;
    color:var(--fg);font:inherit;padding:6px 9px;outline:none}
  .prompt input:focus{border-color:var(--accent)}

  .status{display:flex;gap:18px;align-items:center;background:var(--panel2);
    border-top:1px solid var(--line);padding:4px 10px;color:var(--dim);flex:0 0 auto}
  .status b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
  <div class="menubar">
    <div class="brand"><img src="/favicon.svg" width="18" height="18" alt="" style="vertical-align:-4px;margin-right:7px"/>Layout<span>Workbench</span></div>
    <button class="menu">File</button><button class="menu">Edit</button>
    <button class="menu">View</button><button class="menu">Create</button>
    <button class="menu">Verify</button><button class="menu">Options</button>
    <div class="spacer"></div>
    <div id="aboutSlot"></div>
    <div class="badge">daemon <b id="daemon">connecting…</b></div>
  </div>

  <div class="toolbar">
    <label>Library</label>
    <select id="lib"><option>DEMO</option></select>
    <label>Cell</label>
    <select id="cell"><option>INV</option><option>TOP</option></select>
    <div class="sep"></div>
    <button id="btnOpen">Open Window</button>
    <button id="btnBuild" class="primary">Build INV</button>
    <button id="btnTop">Place 4× in TOP</button>
    <div class="sep"></div>
    <button id="btnSelect">Select All</button>
    <button id="btnFetch">Fetch Attrs</button>
    <button id="btnShot">Screenshot</button>
    <div class="sep"></div>
    <button id="btnFit">Fit</button>
  </div>

  <div class="main">
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div>cellView <b id="hudCell">—</b></div>
        <div>shapes <b id="hudShapes">0</b> · instances <b id="hudInsts">0</b></div>
        <div>X <b id="hudX">0.000</b>  Y <b id="hudY">0.000</b></div>
      </div>
    </div>
    <div class="lsw">
      <h3>Layers (LSW)</h3>
      <div class="layers" id="lsw"></div>
    </div>
  </div>

  <div class="ciw">
    <h3>Command Interpreter Window — every line is real SKILL over TCP</h3>
    <div class="console" id="con"></div>
    <div class="prompt"><span>SKILL&gt;</span>
      <input id="inp" placeholder='e.g.  dbOpenCellViewByType("DEMO" "INV" "layout" "maskLayout" "r")~>bBox' autocomplete="off"/>
    </div>
  </div>

  <div class="status">
    <div>design <b id="stDesign">—</b></div>
    <div>windows <b id="stWin">0</b></div>
    <div>selected <b id="stSel">0</b></div>
    <div style="margin-left:auto">virtuoso-bridge-lite API → mock-virtuoso</div>
  </div>

<script>
</script>
<script src="/render.js"></script>
<script src="/about.js"></script>
<script>

function renderLog(log){
  $("con").innerHTML = log.map(l=>`<div class="${l.kind}">${esc(l.text)}</div>`).join("");
  $("con").scrollTop=$("con").scrollHeight;
}
const esc=s=>(s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

// the renderer flips its own visibility; mirror it into the tool's LSW
function onLayerToggle(name, on){
  api("/api/skill",{skill:`pteSetVisible("${name} drawing" ${on?"t":"nil"} "Layers")`});
}

$("aboutSlot").appendChild(mountAbout("workbench"));

async function api(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  return r.json();
}
async function refresh(reFit){
  const st=await (await fetch("/api/state")).json();
  const d=st.design||{};
  $("stDesign").textContent = d.lib? `${d.lib}/${d.cell}/${d.view}` : "—";
  $("hudCell").textContent  = d.lib? `${d.lib}/${d.cell}/${d.view}` : "—";
  $("stWin").textContent = (st.windows||[]).length;
  $("daemon").textContent = "connected";
  // On first load, follow whatever cellView the daemon currently has open,
  // so the dropdown never disagrees with the status bar.
  if(!window.__synced && d.cell){ window.__synced=true;
    if([...$("cell").options].some(o=>o.value===d.cell)) $("cell").value=d.cell; }
  renderLog(st.log||[]);
  const g=await (await fetch(`/api/geometry?lib=${$("lib").value}&cell=${$("cell").value}`)).json();
  rows=g.rows||[]; masters=g.masters||{}; lsw(); draw(); if(reFit) fit();
}

$("btnOpen").onclick =async()=>{await api("/api/open-window",{lib:$("lib").value,cell:$("cell").value});refresh();};
$("btnBuild").onclick=async()=>{$("cell").value="INV";await api("/api/build-cell",{lib:"DEMO",cell:"INV"});refresh(true);};
$("btnTop").onclick  =async()=>{await api("/api/build-top",{lib:"DEMO",top:"TOP",child:"INV",count:4});
                                $("cell").value="TOP";refresh(true);};
$("btnSelect").onclick=async()=>{const r=await api("/api/select",{});
  const m=/(\d+)/.exec(r.output||""); $("stSel").textContent=m?m[1]:"0"; refresh();};
$("btnFetch").onclick =async()=>{
  // Ask for slots the selected figures actually have: a Shape carries lpp,
  // an Instance carries name/cellName. Asking an object for a slot it does
  // not have is a SKILL error, and the mock reports it rather than inventing one.
  const hasInst = rows.some(r=>r.kind==="instance");
  const fields = hasInst ? ["objType","name","cellName"] : ["objType","lpp"];
  await api("/api/fetch",{fields}); refresh();
};
$("btnShot").onclick  =async()=>{await api("/api/screenshot",{});refresh();};
$("btnFit").onclick   =()=>fit();
$("cell").onchange    =()=>refresh(true);
$("inp").addEventListener("keydown",async e=>{
  if(e.key!=="Enter"||!e.target.value.trim())return;
  const s=e.target.value; e.target.value="";
  await api("/api/skill",{skill:s}); refresh();
});

resize(); refresh(true);
setInterval(()=>refresh(false), 4000);
</script>
</body>
</html>
